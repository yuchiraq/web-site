{{ define "projects_gallery" }}
<section class="projects">
    <div class="container projects-heading" data-aos="fade-up">
        <div>
            <span class="section-kicker">Реальные объекты</span>
            <h2>Наши проекты</h2>
        </div>
        <p>Посмотрите, как проходят работы и выглядят готовые инженерные системы на наших объектах.</p>
    </div>
    <div class="carousel">
        <div class="carousel-row carousel-row-primary">
            <div class="carousel-track" aria-label="Фотографии выполненных объектов">
                <div class="carousel-group">
                    {{range .Photos}}
                    <img src="{{.}}" alt="Фото выполненного объекта" loading="lazy" decoding="async" class="project-carousel-image" tabindex="0" role="button" aria-label="Открыть фото в полном размере">
                    {{end}}
                </div>
                <div class="carousel-group" aria-hidden="true">
                    {{range .Photos}}
                    <img src="{{.}}" alt="" aria-hidden="true" loading="lazy" decoding="async" class="project-carousel-image" tabindex="-1">
                    {{end}}
                </div>
            </div>
        </div>

        <div class="carousel-row carousel-row-secondary">
            <div class="carousel-track" aria-label="Дополнительная строка фотографий выполненных объектов">
                <div class="carousel-group">
                    {{range .PhotosSecondary}}
                    <img src="{{.}}" alt="Фото выполненного объекта" loading="lazy" decoding="async" class="project-carousel-image" tabindex="0" role="button" aria-label="Открыть фото в полном размере">
                    {{end}}
                </div>
                <div class="carousel-group" aria-hidden="true">
                    {{range .PhotosSecondary}}
                    <img src="{{.}}" alt="" aria-hidden="true" loading="lazy" decoding="async" class="project-carousel-image" tabindex="-1">
                    {{end}}
                </div>
            </div>
        </div>
    </div>

    <div id="projectImageModal" class="project-image-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="projectImageCaption">
        <div class="project-image-backdrop" data-close-project-modal="true"></div>
        <button type="button" class="project-image-nav project-image-nav--previous" aria-label="Предыдущее фото">‹</button>
        <figure class="project-image-content">
            <button type="button" class="project-image-close" aria-label="Закрыть просмотр">&times;</button>
            <div class="project-image-viewport">
                <img id="projectImageModalContent" src="" alt="Увеличенное изображение проекта">
            </div>
            <figcaption class="project-image-meta">
                <span id="projectImageCaption">Фото выполненного объекта</span>
                <span id="projectImagePosition" aria-live="polite"></span>
            </figcaption>
        </figure>
        <button type="button" class="project-image-nav project-image-nav--next" aria-label="Следующее фото">›</button>
    </div>
</section>
{{ end }}
